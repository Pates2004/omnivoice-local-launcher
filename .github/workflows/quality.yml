name: Launcher quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install "ruff>=0.11" packaging numpy "num2words>=0.5.14"
      - name: Lint and compile Python sources
        run: |
          ruff check omnivoice tests installer_runtime.py
          ruff format --check omnivoice tests installer_runtime.py
          python -m compileall -q omnivoice tests installer_runtime.py
      - name: Test transactional runtime entry-point repair
        run: python -m unittest discover -s tests -p test_installer_runtime.py -v
      - name: Test lightweight dependency validation
        run: python -m unittest discover -s tests -p test_runtime_requirements.py -v
      - name: Test voice cloning and long reference transcription
        run: python -m unittest discover -s tests -p test_demo_reference.py -v
      - name: Test generated audio and preset validation
        run: python -m unittest discover -s tests -p test_inference_validation.py -v
      - name: Test batched inputs and text normalization
        run: |
          python -m unittest discover -s tests -p test_generation_inputs.py -v
          python -m unittest discover -s tests -p test_text_normalization.py -v

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse and self-test the launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\launcher.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          .\launcher.ps1 -SelfTest
      - name: Test the batch entry point
        shell: cmd
        run: start.bat -SelfTest
      - name: Test startup logic and portable ROCm package installation
        shell: powershell
        run: .\tests\test_launcher.ps1 -Portable
      - name: Test batch paths with special characters
        shell: powershell
        run: .\tests\test_batch_paths.ps1
