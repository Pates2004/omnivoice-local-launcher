name: Launcher quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install "ruff>=0.11"
      - name: Lint and compile Python sources
        run: |
          ruff check omnivoice tests
          ruff format --check omnivoice tests
          python -m compileall -q omnivoice tests

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and self-test the launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\launcher.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          .\launcher.ps1 -SelfTest
      - name: Test the batch entry point
        shell: cmd
        run: start.bat -SelfTest
